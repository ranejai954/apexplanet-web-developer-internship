<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Async JavaScript</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2563eb;
        }
        .output {
            background: #1e293b;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            white-space: pre-wrap;
            max-height: 500px;
            overflow-y: auto;
        }
        .btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .btn-secondary {
            background: #64748b;
        }
        .btn-secondary:hover {
            background: #475569;
        }
        .note {
            background: #fef3c7;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            border-left: 4px solid #f59e0b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 Learning Async JavaScript</h1>
        <p>Open the browser console (F12 → Console) to see the output!</p>
        
        <div class="note">
            <strong>💡 Tip:</strong> Open Developer Tools (F12) and go to the Console tab to see all the async JavaScript examples running.
        </div>

        <button class="btn" onclick="runExamples()">▶️ Run Examples</button>
        <button class="btn btn-secondary" onclick="clearConsole()">🗑️ Clear Console</button>

        <h3>📝 Console Output:</h3>
        <div class="output" id="output">
            Waiting for examples to run...
        </div>
    </div>

    <script src="js/learn.js"></script>
    
    <script>
        // Function to clear console
        function clearConsole() {
            console.clear();
            document.getElementById('output').textContent = 'Console cleared. Run examples again.';
        }
        
        // Function to run examples (called from button)
        function runExamples() {
            console.log('🔄 Running examples again...');
            // The learn.js file will run automatically when loaded
            // But we can also reload the script
            location.reload();
        }
        
        // Override console.log to also show in the page
        const originalLog = console.log;
        const outputDiv = document.getElementById('output');
        
        console.log = function(...args) {
            originalLog(...args);
            const text = args.map(arg => {
                if (typeof arg === 'object') {
                    return JSON.stringify(arg, null, 2);
                }
                return String(arg);
            }).join(' ');
            outputDiv.textContent += text + '\n';
            outputDiv.scrollTop = outputDiv.scrollHeight;
        };
        
        // Override console.error
        const originalError = console.error;
        console.error = function(...args) {
            originalError(...args);
            const text = '❌ ' + args.map(arg => String(arg)).join(' ');
            outputDiv.textContent += text + '\n';
            outputDiv.scrollTop = outputDiv.scrollHeight;
        };
        
        // Initial message
        console.log('✅ Console logging is now also shown on the page!');
        console.log('📚 Watching for async examples...');
    </script>
</body>
</html>
