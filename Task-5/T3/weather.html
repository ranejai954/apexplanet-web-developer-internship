<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Weather App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* ============================================
           WEATHER APP - DARK THEME (MATCHES MOVIE & QUOTE APPS)
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        /* ===== Header ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #334155;
            flex-wrap: wrap;
            gap: 15px;
        }

        .app-header h1 {
            font-size: 2rem;
            color: #facc15;
        }

        .app-header h1 i {
            color: #f59e0b;
        }

        .app-header p {
            color: #94a3b8;
            width: 100%;
            font-size: 0.95rem;
        }

        .back-btn {
            padding: 10px 24px;
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        /* ===== Search Section ===== */
        .search-box {
            display: flex;
            gap: 12px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            padding: 14px 20px;
            border: 2px solid #334155;
            border-radius: 12px;
            font-size: 16px;
            min-width: 200px;
            transition: 0.3s;
            background: #0f172a;
            color: #e2e8f0;
        }

        .search-box input:focus {
            outline: none;
            border-color: #facc15;
            box-shadow: 0 0 0 4px rgba(250, 204, 21, 0.1);
        }

        .search-box input::placeholder {
            color: #64748b;
        }

        /* ===== Buttons ===== */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-primary {
            background: #facc15;
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #eab308;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .btn-active {
            background: #facc15;
            color: #0f172a;
        }

        .btn-active:hover {
            background: #eab308;
        }

        .btn-inactive {
            background: #334155;
            color: #94a3b8;
        }

        .btn-inactive:hover {
            background: #475569;
            color: #e2e8f0;
        }

        /* ===== Unit Toggle ===== */
        .unit-toggle {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .unit-toggle .btn {
            padding: 8px 20px;
            font-size: 14px;
        }

        /* ===== Recent Searches ===== */
        .recent-section {
            margin: 15px 0 20px 0;
        }

        .recent-section p {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .recent-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .recent-tag {
            background: #334155;
            padding: 6px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
            color: #e2e8f0;
            font-weight: 500;
        }

        .recent-tag:hover {
            background: #facc15;
            color: #0f172a;
            transform: translateY(-2px);
        }

        /* ===== Error Message ===== */
        .error {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 16px 20px;
            border-radius: 12px;
            margin: 15px 0;
            display: none;
            border-left: 4px solid #ef4444;
            font-weight: 500;
        }

        /* ===== Loading ===== */
        .loading {
            text-align: center;
            padding: 50px 20px;
            color: #94a3b8;
        }

        .loading i {
            font-size: 3rem;
            color: #facc15;
            animation: spin 1s linear infinite;
            display: block;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Weather Display ===== */
        .weather-card {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d1b69 100%);
            color: white;
            padding: 30px;
            border-radius: 16px;
            margin: 20px 0;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .weather-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
        }

        .weather-temp {
            flex: 1;
        }

        .weather-temp .city-name {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
        }

        .weather-temp .city-country {
            font-size: 1rem;
            opacity: 0.8;
            font-weight: 400;
            color: #94a3b8;
        }

        .weather-temp h1 {
            color: #ffffff;
            font-size: 4rem;
            margin: 5px 0;
            font-weight: 700;
        }

        .weather-temp p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin: 0;
            text-transform: capitalize;
            color: #cbd5e1;
        }

        .weather-icon img {
            width: 120px;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.2));
        }

        .weather-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 15px;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            color: #e2e8f0;
        }

        .detail i {
            font-size: 1.3rem;
            opacity: 0.9;
            width: 24px;
            color: #facc15;
        }

        /* ===== Forecast ===== */
        .forecast-section {
            margin: 30px 0 10px 0;
        }

        .forecast-section h3 {
            color: #e2e8f0;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 15px;
        }

        .forecast-card {
            background: #0f172a;
            padding: 15px 10px;
            border-radius: 12px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid #334155;
        }

        .forecast-card:hover {
            transform: translateY(-4px);
            border-color: #facc15;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .forecast-card p {
            margin: 5px 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .forecast-card .day {
            font-weight: 600;
            color: #e2e8f0;
        }

        .forecast-card img {
            width: 50px;
            margin: 5px 0;
        }

        .forecast-temp {
            font-weight: 700;
            font-size: 1.1rem;
            color: #facc15;
        }

        /* ===== API Key Missing ===== */
        .api-missing {
            background: #7f1d1d;
            color: #fca5a5;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            margin: 20px 0;
            border: 1px solid #dc2626;
        }

        .api-missing h3 {
            color: #fca5a5;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .api-missing code {
            background: #1e293b;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #facc15;
            border: 1px solid #334155;
        }

        .api-missing a {
            color: #facc15;
            text-decoration: underline;
        }

        /* ===== Responsive ===== */
        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }

            .weather-main {
                flex-direction: column;
                text-align: center;
            }

            .weather-temp h1 {
                font-size: 3rem;
            }

            .weather-icon img {
                width: 100px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input {
                width: 100%;
            }

            .btn {
                justify-content: center;
                width: 100%;
            }

            .unit-toggle {
                justify-content: center;
            }

            .unit-toggle .btn {
                flex: 1;
                max-width: 100px;
            }

            .forecast-grid {
                grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            }

            .app-header h1 {
                font-size: 1.5rem;
            }

            .weather-details {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 15px;
                border-radius: 12px;
            }

            .weather-temp h1 {
                font-size: 2.5rem;
            }

            .weather-details {
                grid-template-columns: 1fr;
            }

            .forecast-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .forecast-card {
                padding: 10px 5px;
            }

            .forecast-card img {
                width: 35px;
            }

            .detail {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== Header ===== -->
        <div class="app-header">
            <div>
                <h1><i class="fas fa-cloud-sun"></i> Weather App</h1>
                <p>Check current weather and 5-day forecast</p>
            </div>
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <!-- ===== Search Section ===== -->
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name... (e.g., London, Mumbai)">
            <button id="searchBtn" class="btn btn-primary">
                <i class="fas fa-search"></i> Search
            </button>
            <button id="geoBtn" class="btn btn-secondary">
                <i class="fas fa-location-dot"></i> My Location
            </button>
        </div>

        <!-- ===== Unit Toggle ===== -->
        <div class="unit-toggle">
            <button id="celsiusBtn" class="btn btn-active">°C</button>
            <button id="fahrenheitBtn" class="btn btn-inactive">°F</button>
        </div>

        <!-- ===== Recent Searches ===== -->
        <div id="recentSearches" class="recent-section"></div>

        <!-- ===== Error Message ===== -->
        <div id="errorMessage" class="error"></div>

        <!-- ===== Weather Display ===== -->
        <div id="weatherDisplay">
            <div class="loading">
                <i class="fas fa-cloud-sun"></i>
                <p>Enter a city to get weather information</p>
                <p style="font-size:0.85rem;color:#64748b;margin-top:10px;">
                    <i class="fas fa-info-circle"></i> Try: London, Mumbai, Tokyo, New York
                </p>
            </div>
        </div>

        <!-- ===== Forecast Display ===== -->
        <div id="forecastDisplay"></div>

    </div>

    <!-- ===== Load Config FIRST ===== -->
    <script src="js/config.js"></script>

    <!-- ===== Then Load Weather App ===== -->
    <script src="js/weather.js"></script>

</body>
</html>
