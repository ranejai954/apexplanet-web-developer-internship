<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💬 Quote & User Generator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        /* ============================================
           QUOTE & USER APP STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background: #1e293b;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        /* ===== Header ===== */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #334155;
            flex-wrap: wrap;
            gap: 15px;
        }

        .app-header h1 {
            font-size: 2rem;
            color: #facc15;
        }

        .app-header p {
            color: #94a3b8;
            width: 100%;
            font-size: 0.95rem;
        }

        .back-btn {
            padding: 10px 24px;
            background: #334155;
            color: #e2e8f0;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: 0.3s;
        }

        .back-btn:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        /* ===== Sections ===== */
        .section {
            background: #0f172a;
            border-radius: 16px;
            padding: 30px;
            margin: 25px 0;
            border: 1px solid #334155;
        }

        .section h2 {
            color: #e2e8f0;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .section h2 i {
            margin-right: 10px;
        }

        /* ===== Quote Display ===== */
        .quote-display {
            text-align: center;
            padding: 30px 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .quote-display .quote-text {
            font-size: 1.6rem;
            font-style: italic;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .quote-display .quote-text i {
            color: #facc15;
            opacity: 0.5;
        }

        .quote-display .quote-author {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #94a3b8;
            font-weight: 500;
        }

        .quote-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== User Display ===== */
        .user-display {
            display: flex;
            justify-content: center;
        }

        .user-card {
            text-align: center;
            padding: 20px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            width: 100%;
            max-width: 400px;
        }

        .user-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #facc15;
            margin-bottom: 15px;
            object-fit: cover;
        }

        .user-card .user-name {
            color: #e2e8f0;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .user-card .user-email {
            color: #94a3b8;
            font-size: 0.95rem;
            margin: 5px 0;
        }

        .user-card .user-location {
            color: #64748b;
            font-size: 0.9rem;
        }

        .user-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ===== Buttons ===== */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #facc15;
            color: #0f172a;
        }

        .btn-primary:hover {
            background: #eab308;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(250, 204, 21, 0.3);
        }

        .btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #22c55e;
            color: white;
        }

        .btn-success:hover {
            background: #16a34a;
            transform: translateY(-2px);
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .btn-twitter {
            background: #1da1f2;
            color: white;
        }

        .btn-twitter:hover {
            background: #1a8cd8;
            transform: translateY(-2px);
        }

        .btn-small {
            padding: 6px 14px;
            font-size: 12px;
        }

        /* ===== Contacts ===== */
        .contacts-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }

        .contacts-section h3 {
            color: #e2e8f0;
            margin-bottom: 15px;
        }

        .contacts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
        }

        .contact-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            border: 1px solid #334155;
            transition: 0.3s;
        }

        .contact-card:hover {
            border-color: #facc15;
            transform: translateY(-4px);
        }

        .contact-card img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            margin-bottom: 10px;
            border: 2px solid #facc15;
        }

        .contact-card h4 {
            color: #e2e8f0;
            font-size: 0.95rem;
        }

        .contact-card p {
            color: #94a3b8;
            font-size: 0.8rem;
        }

        .contact-card .contact-actions {
            margin-top: 10px;
        }

        /* ===== Loading ===== */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #94a3b8;
        }

        .loading i {
            font-size: 2rem;
            color: #facc15;
            animation: spin 1s linear infinite;
            display: block;
            margin-bottom: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Toast ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #22c55e;
            color: white;
            padding: 14px 30px;
            border-radius: 12px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 9999;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background: #ef4444;
        }

        /* ===== Responsive ===== */
        @media (max-width: 700px) {
            .container {
                padding: 20px;
            }

            .app-header h1 {
                font-size: 1.5rem;
            }

            .section {
                padding: 20px;
            }

            .quote-display .quote-text {
                font-size: 1.2rem;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .quote-actions {
                flex-direction: column;
            }

            .user-actions {
                flex-direction: column;
            }

            .contacts-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            .contacts-grid {
                grid-template-columns: 1fr;
            }

            .user-card img {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== Header ===== -->
        <div class="app-header">
            <div>
                <h1><i class="fas fa-quote-left"></i> Quote & User Generator</h1>
                <p>Get inspired with random quotes and generate user profiles</p>
            </div>
            <a href="index.html" class="back-btn">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>

        <!-- ===== QUOTE SECTION ===== -->
        <div class="section">
            <h2><i class="fas fa-quote-right" style="color:#facc15;"></i> Random Quote</h2>

            <div class="quote-display">
                <div id="quoteContent">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Loading quote...</p>
                    </div>
                </div>
            </div>

            <div class="quote-actions">
                <button id="newQuoteBtn" class="btn btn-primary">
                    <i class="fas fa-sync"></i> New Quote
                </button>
                <button id="copyQuoteBtn" class="btn btn-secondary">
                    <i class="fas fa-copy"></i> Copy
                </button>
                <button id="tweetQuoteBtn" class="btn btn-twitter">
                    <i class="fab fa-twitter"></i> Tweet
                </button>
            </div>
        </div>

        <!-- ===== USER SECTION ===== -->
        <div class="section">
            <h2><i class="fas fa-user" style="color:#22c55e;"></i> Random User</h2>

            <div class="user-display">
                <div id="userContent">
                    <div class="loading">
                        <i class="fas fa-spinner"></i>
                        <p>Loading user...</p>
                    </div>
                </div>
            </div>

            <div class="user-actions">
                <button id="newUserBtn" class="btn btn-primary">
                    <i class="fas fa-user-plus"></i> Generate User
                </button>
                <button id="saveUserBtn" class="btn btn-success">
                    <i class="fas fa-save"></i> Save Contact
                </button>
                <button id="downloadVCardBtn" class="btn btn-secondary">
                    <i class="fas fa-download"></i> vCard
                </button>
            </div>

            <!-- ===== Contacts ===== -->
            <div class="contacts-section">
                <h3><i class="fas fa-address-book" style="color:#facc15;"></i> Saved Contacts</h3>
                <div id="contactsGrid" class="contacts-grid">
                    <div style="grid-column:1/-1;text-align:center;color:#64748b;padding:20px;">
                        <i class="fas fa-users" style="font-size:2rem;display:block;margin-bottom:10px;color:#475569;"></i>
                        <p>No contacts saved yet. Generate a user and click "Save Contact"!</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== Toast Notification ===== -->
    <div id="toast" class="toast"></div>

    <!-- ===== Load Scripts ===== -->
    <script src="js/quotes.js"></script>
    <script src="js/randomuser.js"></script>

</body>
</html>
